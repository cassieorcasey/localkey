[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localkey"
version = "0.1.0"
description = "CLI password generator dengan perhitungan entropi yang jujur"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
clipboard = ["pyperclip>=1.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "scipy>=1.11"]

[project.scripts]
localkey = "localkey.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localkey = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not statistical'"
markers = [
    "statistical: uji chi-square dengan keacakan sungguhan; jalankan dengan -m statistical",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
